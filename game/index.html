<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GHOSTS 'N GOALS · Cesena FC</title>
  <meta name="description" content="L'arcade di Halloween del Cesena FC. Salva il Magazziniere Petrosino, entra in classifica. DAIBURDEL!" />
  <meta property="og:title" content="GHOSTS 'N GOALS · Cesena FC" />
  <meta property="og:description" content="Hanno rapito il Magazziniere Petrosino. Tocca a te. L'arcade di Halloween del Cesena FC." />
  <style>
    /* stile della schermata di caricamento qui dentro: deve vedersi prima di ogni altro file */
    #boot { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%;
      background: radial-gradient(ellipse at 50% 40%, #1d1744 0, #07050f 70%); color: #f4f4f0;
      font-family: 'Press Start 2P', ui-monospace, Menlo, Consolas, monospace; font-weight: 700; transition: opacity .35s; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot { container-type: inline-size; }
    .boot-title { white-space: nowrap; font-size: clamp(10px, 3.6vmin, 26px); font-size: 7.4cqw; letter-spacing: .04em; text-shadow: 3px 3px 0 #000, -2px 0 0 #ff7a1a, 2px 0 0 #ff7a1a; }
    .boot-title em { font-style: normal; color: #ff7a1a; }
    .boot-ghost { width: 12%; aspect-ratio: 1; background: #e8e4fa; border-radius: 50% 50% 18% 18%; position: relative; animation: bootfloat 1.1s ease-in-out infinite;
      box-shadow: 0 0 24px rgba(159, 232, 255, .35); }
    .boot-ghost::before, .boot-ghost::after { content: ''; position: absolute; top: 34%; width: 16%; height: 22%; background: #07050f; border-radius: 40%; }
    .boot-ghost::before { left: 26%; } .boot-ghost::after { right: 26%; }
    .boot-bar { width: 46%; height: clamp(6px, 1.8vmin, 12px); border: 2px solid #ff7a1a; padding: 2px; background: #000; }
    .boot-bar i { display: block; height: 100%; width: 4%; background: #ffd23f; transition: width .15s; }
    .boot-txt { font-size: clamp(8px, 2.2vmin, 14px); font-size: 3.4cqw; color: #9fe8ff; animation: bootblink .9s steps(1) infinite; }
    @keyframes bootfloat { 0%, 100% { transform: translateY(-6%); } 50% { transform: translateY(6%); } }
    @keyframes bootblink { 50% { opacity: .25; } }
  </style>
  <script>
    // lingua della scritta di caricamento (il resto lo decide il gioco)
    try { if (!/^it/i.test((navigator.languages && navigator.languages[0]) || navigator.language || 'it') && !(navigator.languages || []).slice(0, 2).some(function (l) { return /^it/i.test(l); })) document.addEventListener('DOMContentLoaded', function () { var t = document.getElementById('bootTxt'); if (t) t.textContent = 'LOADING...'; }); } catch (e) {}
  </script>
</head>
<body>
  <div id="room">
    <div id="cabinet" aria-label="Cabinato arcade">
      <header class="marquee">
        <div class="marquee-glass">
          <span class="m-top">CESENA FC PRESENTA</span>
          <span class="m-title">GHOSTS <em>'N</em> GOALS</span>
        </div>
      </header>

      <div class="bezel">
        <div id="screen">
          <div id="game"></div>
          <!-- schermata di caricamento: compare subito, prima ancora del gioco; la toglie BootScene -->
          <div id="boot" aria-live="polite">
            <div class="boot-title">GHOSTS <em>'N</em> GOALS</div>
            <div class="boot-ghost" aria-hidden="true"></div>
            <div class="boot-bar"><i id="bootFill"></i></div>
            <div class="boot-txt" id="bootTxt">CARICAMENTO...</div>
          </div>
          <div class="crt" aria-hidden="true"></div>
        </div>
      </div>

      <div class="panel">
        <div id="stickZone" class="stick-zone" aria-hidden="true"></div>
        <div id="stick" class="stick" aria-label="Joystick">
          <div class="stick-gate"></div>
          <div class="stick-knob"></div>
        </div>
        <div class="buttons">
          <button id="btnB" class="btn btn-b" aria-label="Tiro"><span>B</span><small data-i18n="kick">TIRO</small></button>
          <button id="btnA" class="btn btn-a" aria-label="Salto"><span>A</span><small data-i18n="jump">SALTO</small></button>
        </div>
        <button id="btnStart" class="btn-start" aria-label="Start">START</button>
      </div>

      <div class="cab-foot">
        <div class="coin-door"><span class="coin-slot"></span><span class="coin-label">25¢</span></div>
        <div class="speaker" aria-hidden="true"></div>
        <div class="instr-card">
          <b data-i18n="howto">COME SI GIOCA</b>
          <span>← → <i data-i18n="run">CORRI</i> · ↓ <i data-i18n="crouch">ABBASSATI</i></span>
          <span>Z <i data-i18n="jumpKey">SALTA</i> · X <i data-i18n="kickKey">TIRA</i> · ↑+X <i data-i18n="header">COLPO DI TESTA</i></span>
        </div>
      </div>
    </div>

    <nav class="cab-tools">
      <button id="tMute" aria-label="Audio">🔊</button>
      <button id="tCrt" aria-label="Effetto CRT">CRT</button>
      <button id="tFull" aria-label="Schermo intero">⛶</button>
      <button id="tCookie" aria-label="Cookie policy" title="Cookie policy" hidden>🍪</button>
    </nav>
  </div>
  <div id="legal" class="legal" role="dialog" aria-modal="true" aria-label="Cookie policy" hidden>
    <div class="legal-box">
      <button class="legal-x" aria-label="Chiudi">✕</button>
      <div class="legal-body"></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
